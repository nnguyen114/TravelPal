name: core-api
on:
  push: { branches: [main, develop], paths: ["core-api/**", ".github/workflows/core-api.yml"] }
  pull_request: { paths: ["core-api/**", ".github/workflows/core-api.yml"] }
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: core-api } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Test + coverage gate (JaCoCo 80% line / 70% branch)
        run: ./mvnw -B verify
