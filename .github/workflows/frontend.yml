name: frontend
on:
  push: { branches: [main, develop], paths: ["frontend/**", ".github/workflows/frontend.yml"] }
  pull_request: { paths: ["frontend/**", ".github/workflows/frontend.yml"] }
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with: { node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - name: Test + coverage gate (80% lines / 70% branches)
        run: npm run coverage
      - run: npm run build
