name: ai-service
on:
  push: { branches: [main, develop], paths: ["ai-service/**", ".github/workflows/ai-service.yml"] }
  pull_request: { paths: ["ai-service/**", ".github/workflows/ai-service.yml"] }
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ai-service } }
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - name: Test + coverage gate (80%)
        run: uv run pytest
